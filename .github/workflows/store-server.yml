name: Loja (server)

on:
  push:
    paths:
      - 'server/**'
      - 'store/**'
      - 'admin/**'
      - '.github/workflows/store-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'store/**'
      - 'admin/**'
      - '.github/workflows/store-server.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cc -d cc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cc:cc@localhost:5432/cc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verificar sintaxe do frontend
        working-directory: .
        run: |
          for f in store/js/*.js admin/js/*.js; do node --check "$f"; done
